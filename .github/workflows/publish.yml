name: Publish to NuGet
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-publish:
    # Publish only from development (Run workflow) or from a v* tag.
    if: github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read   # checkout; without this line contents is none
      id-token: write  # GitHub OIDC token for NuGet/login (trusted publishing)

    steps:
      # Pinned to commits: this job can obtain a NuGet API key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # Nerdbank.GitVersioning needs the full history
          persist-credentials: false  # no Git token needed after the checkout
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet --version  # global.json: an SDK 10.0, never the runner's newer preinstalled SDK
      - run: dotnet restore SecsGemBase.sln
      - run: dotnet build SecsGemBase.sln -c Release --no-restore
      - name: Test
        run: dotnet test SecsGemBase.sln -c Release --no-build
      - run: dotnet pack SecsGemBase.sln -c Release --no-build -o nupkgs

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push the package
      - name: NuGet push
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
