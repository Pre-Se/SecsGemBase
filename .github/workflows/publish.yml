name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SecsGemBase.sln

      - name: Build
        run: dotnet build SecsGemBase.sln -c Release --no-restore

      - name: Pack
        run: dotnet pack SecsGemBase.sln -c Release --no-build -o nupkgs

      - name: Push to GitHub Packages
        run: dotnet nuget push 'nupkgs/*.nupkg' --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/Pre-Se/

      - name: Push to nuget.org
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push 'nupkgs/*.nupkg' --api-key ${{ env.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
